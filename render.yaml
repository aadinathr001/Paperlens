services:
  - type: web
    name: paperlens
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: GROQ_API_KEY
        sync: false   # Set manually in Render dashboard — never commit the value
    plan: free
